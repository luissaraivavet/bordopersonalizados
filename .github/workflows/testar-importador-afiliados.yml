name: Testar importador de afiliados

on:
  pull_request:
    paths:
      - 'scripts/importar_afiliados.py'
      - 'scripts/requirements-scrapling.txt'
      - 'tests/test_importar_afiliados.py'
      - 'tests/fixtures/anuncio_afiliado_exemplo.html'
      - 'content/afiliados-links.json'
      - 'content/afiliados-rascunho-arvore.json'
      - 'blog/**'
      - 'preview/**'
      - 'sitemap.xml'
      - 'tests/test_blog.py'
      - '.github/workflows/testar-importador-afiliados.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Scrapling
        run: python -m pip install -r scripts/requirements-scrapling.txt
      - name: Verificar sintaxe
        run: python -m py_compile scripts/importar_afiliados.py tests/test_importar_afiliados.py
      - name: Testar parser e URLs sem acessar o Mercado Livre
        run: python -m unittest discover -s tests -p test_importar_afiliados.py -v
      - name: Testar SEO e evidências dos guias da Bordô
        run: python -m unittest discover -s tests -p test_blog.py -v
